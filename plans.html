<html lang="en">
<meta charset="utf-8">
<title>planatlas navigator</title>
<script>
(function () {
  try {
    if (new URLSearchParams(location.search || "").get("embedded") === "1") {
      document.documentElement.setAttribute("data-embedded", "1");
    }
  } catch (e) {}
})();
</script>
<style>
  @font-face { font-family: "OpenDyslexic3"; src: url("/fonts/OpenDyslexic3-Regular.ttf") format("truetype"); font-weight: 400; }
  @font-face { font-family: "OpenDyslexic3"; src: url("/fonts/OpenDyslexic3-Bold.ttf") format("truetype"); font-weight: 700; }
  :root {
    --bg:#0b0f14; --panel:#121820; --line:#1e2833; --ink:#dfe7ef; --dim:#8b9aab;
    --accent:#7cf7ff; --hot:#ffa94d; --ok:#51cf66; --err:#ff8a8a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  html[data-type="compact"] body { zoom: 0.82; }
  html[data-type="dense"] body { zoom: 0.9; }
  html[data-type="large"] body { zoom: 1.14; }
  html[data-type="huge"] body { zoom: 1.28; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "OpenDyslexic3", system-ui, sans-serif; font-size: 14px; line-height: 1.4;
    display: grid; grid-template-rows: auto auto minmax(0,1fr) auto;
  }
  header { flex: none; padding: 8px 12px 6px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 17px; letter-spacing: .3px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--dim); font-size: 12px; }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; align-items: center; }
  .rot { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .rot span {
    font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 7px; color: var(--dim);
  }
  button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  #go { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  #cull[aria-pressed="true"] { border-color: var(--hot); color: var(--hot); font-weight: 700; }
  html[data-cull="1"] .temps { display: none; }
  html[data-cull="1"] .rot { display: none; }
  #msg { margin-left: auto; font-size: 12px; color: var(--dim); }
  #msg.ok { color: var(--ok); } #msg.err { color: var(--err); }
  #q {
    flex: 1 1 120px; min-width: 100px; max-width: 220px;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 9px; font: inherit; font-size: 13px;
  }
  .work {
    min-height: 0; overflow: hidden;
    display: grid; grid-template-columns: minmax(12rem, 26%) minmax(0,1fr);
  }
  #list { overflow: auto; border-right: 1px solid var(--line); padding: 8px; }
  /* Briefs + thin meaning | gutter | in-the-plan. Meaning is not a fat column. */
  .atlas {
    min-width: 0; min-height: 0; overflow: hidden;
    display: grid;
    grid-template-columns: minmax(10rem, 34%) 8px minmax(0,1fr);
    gap: 0; padding: 8px;
  }
  .col {
    min-width: 0; min-height: 0; overflow: hidden;
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
    display: grid; grid-template-rows: auto minmax(0,1fr);
  }
  .briefs-col {
    display: grid;
    grid-template-rows: auto minmax(0,1fr) 8px auto;
  }
  .briefs-col .body {
    overflow-x: hidden;
    overflow-y: hidden;
  }
  .gutter-v, .gutter-h {
    background: transparent;
    position: relative;
  }
  .gutter-v { cursor: col-resize; }
  .gutter-h { cursor: row-resize; }
  .gutter-v:hover, .gutter-h:hover,
  .gutter-v.dragging, .gutter-h.dragging {
    background: rgba(124,247,255,0.28);
  }
  .mean-row {
    min-height: 1.4em;
    max-height: 2.6em;
    overflow: hidden;
    padding: 4px 8px;
    border-top: 1px solid var(--line);
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .02em;
    line-height: 1.25;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .spine {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    overflow: auto;
  }
  .spine .sp {
    min-width: 0;
    border-left: 1px solid var(--line);
    padding-left: 6px;
  }
  .spine .sp:first-child { border-left: 0; padding-left: 0; }
  .spine .sp h3 {
    margin: 0 0 6px; font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--dim); font-weight: 700;
  }
  .spine .sp p {
    margin: 0; font-size: 13px; line-height: 1.45;
    word-break: break-word; color: var(--ink);
  }
  .col h2 {
    margin: 0; padding: 6px 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--dim); border-bottom: 1px solid var(--line);
  }
  .col .body { padding: 7px 8px; overflow: auto; font-size: 13px; color: var(--dim); }
  .brief {
    display: flex; width: 100%; text-align: left; margin: 0 0 2px; padding: 3px 6px;
    border: 1px solid transparent; align-items: baseline; gap: 8px;
    white-space: nowrap; overflow: hidden;
  }
  .brief.on { border-color: var(--accent); background: #16202b; }
  .brief b {
    flex: 1 1 auto; min-width: 0; color: var(--ink); font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .brief span { flex: none; color: var(--dim); font-size: 11px; }
  .group { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; margin-bottom: 8px; }
  details.group { overflow: hidden; }
  details.group > summary.ghead {
    cursor: pointer; list-style: none;
  }
  details.group > summary.ghead::-webkit-details-marker { display: none; }
  details.brief-group {
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
    margin: 0 0 6px; overflow: hidden;
  }
  details.brief-group > summary {
    cursor: pointer; list-style: none; padding: 5px 8px;
    display: flex; gap: 8px; align-items: baseline;
    font-size: 12px; color: var(--dim); letter-spacing: .04em;
  }
  details.brief-group > summary::-webkit-details-marker { display: none; }
  details.brief-group > summary b { color: var(--accent); font-size: 13px; }
  details.brief-group > summary .n { margin-left: auto; }
  details.brief-group .brief-wrap { padding: 4px 6px 6px; }
  .ghead {
    display: flex; gap: 8px; align-items: baseline; padding: 6px 10px;
    border-bottom: 1px solid var(--line); font-size: 12px; color: var(--dim);
    text-transform: uppercase; letter-spacing: .06em;
  }
  .ghead b { color: var(--accent); font-size: 13px; letter-spacing: .04em; text-transform: none; }
  .ghead .n { margin-left: auto; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.plan {
    padding: 7px 10px; border-bottom: 1px solid #16202b; cursor: pointer;
  }
  li.plan:last-child { border-bottom: 0; }
  li.plan:hover { background: #16202b; }
  li.plan.on { background: #1a2430; box-shadow: inset 3px 0 0 var(--accent); }
  .title { font-weight: 700; font-size: 13px; word-break: break-word; }
  .meta { font-size: 11px; color: var(--dim); font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; }
  .badge {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; padding: 1px 6px; border-radius: 4px; margin-right: 6px;
    vertical-align: middle; border: 1px solid var(--line);
  }
  .badge.apt { color: var(--ok); border-color: #2f6f3e; }
  .badge.inapt { color: var(--hot); border-color: #8a5a20; }
  .temps {
    border-top: 1px solid var(--line); display: grid;
    grid-template-columns: 1fr 1fr 1fr; min-height: 7.5rem; max-height: 28vh;
  }
  .temp { display: grid; grid-template-rows: auto minmax(0,1fr) auto; border-right: 1px solid var(--line); min-width: 0; }
  .temp:last-child { border-right: 0; }
  .temp label { padding: 4px 8px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  .temp textarea {
    width: 100%; height: 100%; resize: none; border: 0; padding: 4px 8px;
    background: #0e141c; color: var(--ink); font: inherit; font-size: 13px;
  }
  .temp .row { padding: 4px 8px; display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--dim); }
  .empty { color: var(--dim); padding: 16px; font-size: 13px; }
  .cth-titlebar {
    display: none; flex: none; padding: 12px 14px; font-weight: 700; font-size: 18px;
    color: var(--accent); letter-spacing: .3px; background: var(--panel);
  }
  .cth-titlebar .hint { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 10px; }
  html.cth-on:not(.cth-open) body { overflow: hidden; display: flex; flex-direction: column; }
  html.cth-on:not(.cth-open) body > *:not(.cth-titlebar) { display: none !important; }
  html.cth-on:not(.cth-open) .cth-titlebar {
    display: flex; align-items: center; flex: 1 1 auto; min-height: 100%; width: 100%; border: 0;
  }
  html.cth-on.cth-open .cth-titlebar { display: none; }
  html[data-embedded="1"] .article-chrome,
  html[data-embedded="1"] .cth-titlebar { display: none !important; }
  html[data-embedded="1"] header { padding-top: 8px; }
  html[data-embedded="1"].cth-on:not(.cth-open) body > header,
  html[data-embedded="1"].cth-on:not(.cth-open) body > .work,
  html[data-embedded="1"].cth-on:not(.cth-open) body > .temps {
    display: block !important;
  }
</style>
<div class="cth-titlebar">planatlas navigator<span class="hint">hover to open</span></div>
<header>
  <div class="article-chrome">
    <h1>planatlas <span>navigator</span></h1>
    <div class="sub">Navigate the planatlas · backup first · cull hides inapt · does not delete · not a planner</div>
  </div>
  <div class="bar">
    <button type="button" id="go">Refresh</button>
    <button type="button" id="backup" title="Copy every plan and temp into a stamped audit folder. Originals stay.">backup</button>
    <button type="button" id="cull" aria-pressed="false" title="Hide inapt · thin empty briefs · hide temps. Always backups first. Does not delete.">cull</button>
    <input type="text" id="q" placeholder="narrow list" autocomplete="off" spellcheck="false" />
    <span id="msg"></span>

</header>
<div class="work">
  <div id="list" class="empty">Loading…</div>
  <div class="atlas" id="atlas">
    <section class="col briefs-col" id="briefsCol">
      <h2>Briefs</h2>
      <div class="body" id="briefs">Pick a plan.</div>
      <div class="gutter-h" id="gutterMean" role="separator" aria-orientation="horizontal" aria-label="Thickness of meaning under briefs"></div>

    </section>
    <div class="gutter-v" id="gutterPlan" role="separator" aria-orientation="vertical" aria-label="Width between briefs and the plan"></div>

    <textarea id="t-sequence-granular" spellcheck="false" placeholder="in → out → stop per line"></textarea>

<script>
(function () {
  const listEl = document.getElementById("list");
  const msg = document.getElementById("msg");
  const q = document.getElementById("q");
  const briefsEl = document.getElementById("briefs");
  const meanEl = document.getElementById("mean");
  const bodyEl = document.getElementById("bodycol");
  let items = [];
  let selected = null;
  let sections = [];
  let viewSecs = [];
  let secOn = 0;
  let cullOn = false;
  try { cullOn = localStorage.getItem("planatlas-cull") === "1"; } catch (_) {}

  function setMsg(t, kind) {
    msg.textContent = t || "";
    msg.className = kind || "";
  }

  function bySource(rows) {
    const m = new Map();
    for (const it of rows) {
      const s = it.source || "other";
      if (!m.has(s)) m.set(s, []);
      m.get(s).push(it);
    }
    return m;
  }

  function filtered() {
    const needle = (q.value || "").trim().toLowerCase();
    return items.filter((it) => {
      if (cullOn) {
        const st = String(it.status || "").toLowerCase();
        if (st === "inapt") return false;
      }
      if (!needle) return true;
      const hay = [it.name, it.rel, it.source, it.title, it.slug, it.status, (it.aliases || []).join(" ")].join(" ").toLowerCase();
      return hay.includes(needle);
    });
  }

  function applyCullChrome() {
    document.documentElement.setAttribute("data-cull", cullOn ? "1" : "0");
    const btn = document.getElementById("cull");
    if (btn) {
      btn.setAttribute("aria-pressed", cullOn ? "true" : "false");
      btn.textContent = cullOn ? "cull on" : "cull";
    }
  }

  function parseSections(text) {
    const lines = String(text || "").split(/\r?\n/);
    const out = [];
    let cur = { title: "(head)", body: [], level: 1 };
    for (const line of lines) {
      const m = /^(#{1,3})\s+(.+)/.exec(line);
      if (m) {
        if (cur.body.length || out.length) out.push(cur);
        cur = { title: m[2].trim(), body: [], level: m[1].length };
      } else {
        cur.body.push(line);
      }
    }
    out.push(cur);
    return out.filter((s) => s.title || s.body.some((x) => x.trim()));
  }

  function nestBriefs(secs) {
    const groups = [];
    let cur = null;
    for (const s of secs) {
      const lv = s.level || 1;
      if (!cur || lv <= 1) {
        cur = {
          title: lv <= 1 ? s.title : "briefs",
          open: groups.length === 0,
          items: [s],
        };
        groups.push(cur);
      } else {
        cur.items.push(s);
      }
    }
    return groups;
  }

  const SKIP_ABBR = new Set(["a","an","the","and","or","of","to","in","on","for","with","from","at","as","is","be"]);
  const KNOWN_ABBR = {
    phase: "ph", phases: "ph",
    task: "tsk", tasks: "tsk",
    implementation: "impl", implement: "impl",
    sequence: "seq",
    recording: "rec",
    document: "doc", documents: "docs",
  };

  function fiveWords(s) {
    const raw = [s && s.title, (s && s.body || []).join(" ")].filter(Boolean).join(" ");
    const words = String(raw).replace(/[#*_`>-]/g, " ").split(/\s+/).filter(Boolean);
    return words.slice(0, 5).join(" ");
  }

  function sharedAbbreviate(titles) {
    const counts = new Map();
    for (const t of titles) {
      const seen = new Set();
      for (const w of String(t).split(/\s+/)) {
        const k = w.toLowerCase().replace(/[^a-z0-9-]/g, "");
        if (!k || SKIP_ABBR.has(k) || k.length < 4 || seen.has(k)) continue;
        seen.add(k);
        counts.set(k, (counts.get(k) || 0) + 1);
      }
    }
    const n = titles.length;
    const share = new Set();
    counts.forEach((c, k) => {
      if (c >= 2 && (n < 3 || c >= Math.ceil(n * 0.4))) share.add(k);
    });
    return function paint(title) {
      return String(title).split(/\s+/).map((w) => {
        const k = w.toLowerCase().replace(/[^a-z0-9-]/g, "");
        if (!share.has(k)) return w;
        const short = KNOWN_ABBR[k] || (k.length > 6 ? k.slice(0, 3) : null);
        return short || w;
      }).join(" ");
    };
  }

  function spinePaint(text) {
    bodyEl.className = "body spine";
    bodyEl.innerHTML = "";
    const raw = String(text || "").trim();
    if (!raw) {
      bodyEl.textContent = "(empty)";
      return;
    }
    const names = [];
    const acts = [];
    const rest = [];
    raw.split(/\s+/).forEach((w) => {
      if (!w) return;
      if (/[/\\]/.test(w) || /^`/.test(w) || /^[A-Z][A-Za-z0-9_-]{2,}/.test(w) || /^\d/.test(w)) {
        names.push(w);
      } else if (/^(add|hide|copy|cull|backup|refresh|open|write|read|move|keep|drop|fix|show|paint|split|stitch|load|save|click|resize)s?$/i.test(w) || /ing$/.test(w)) {
        acts.push(w);
      } else {
        rest.push(w);
      }
    });
    [
      ["names", names],
      ["acts", acts],
      ["rest", rest],
    ].forEach(([lab, arr]) => {
      const box = document.createElement("div");
      box.className = "sp";
      const h = document.createElement("h3");
      h.textContent = lab;
      const p = document.createElement("p");
      p.textContent = arr.join(" ") || "—";
      box.appendChild(h);
      box.appendChild(p);
      bodyEl.appendChild(box);
    });
  }

  function showSec(i) {
    secOn = i;
    const s = viewSecs[i];
    [].forEach.call(briefsEl.querySelectorAll(".brief"), (el, j) => el.classList.toggle("on", j === i));
    if (!s) {
      meanEl.textContent = "";
      bodyEl.textContent = "";
      return;
    }
    const paras = s.body.join("\n").trim();
    meanEl.textContent = fiveWords(s);
    if (cullOn) {
      const first = s.body.map((x) => x.trim()).find((x) => x);
      spinePaint(first || "(empty)");
    } else {
      spinePaint(paras || "(empty section)");
    }
  }

  function renderBriefs() {
    briefsEl.innerHTML = "";
    if (!sections.length) {
      viewSecs = [];
      briefsEl.className = "empty";
      briefsEl.textContent = selected ? "No headings in this plan." : "Pick a plan.";
      return;
    }
    briefsEl.className = "body";
    viewSecs = cullOn
      ? sections.filter((s) => s.body.some((x) => x.trim()))
      : sections.slice();
    const groups = nestBriefs(viewSecs);
    let idx = 0;
    for (const g of groups) {
      const box = document.createElement("details");
      box.className = "brief-group";
      box.open = !!g.open;
      const sum = document.createElement("summary");
      sum.innerHTML = "<b></b><span class='n'></span>";
      sum.querySelector("b").textContent = g.title;
      sum.querySelector(".n").textContent = g.items.length + " brief" + (g.items.length === 1 ? "" : "s");
      box.appendChild(sum);
      const wrap = document.createElement("div");
      wrap.className = "brief-wrap";
      const abbr = sharedAbbreviate(g.items.map((s) => s.title));
      for (const s of g.items) {
        const i = idx++;
        const b = document.createElement("button");
        b.type = "button";
        b.className = "brief" + (i === secOn ? " on" : "");
        b.innerHTML = "<b></b><span></span>";
        b.querySelector("b").textContent = abbr(s.title);
        b.querySelector("b").title = s.title;
        const n = s.body.filter((x) => x.trim()).length;
        b.querySelector("span").textContent = n ? String(n) : "·";
        b.addEventListener("click", () => showSec(i));
        b.addEventListener("mouseenter", () => showSec(i));
        wrap.appendChild(b);
      }
      box.appendChild(wrap);
      briefsEl.appendChild(box);
    }
    showSec(Math.min(secOn, Math.max(0, viewSecs.length - 1)));
  }

  function render() {
    const rows = filtered();
    listEl.innerHTML = "";
    listEl.className = "";
    if (!rows.length) {
      listEl.className = "empty";
      listEl.textContent = items.length ? "No match." : "No plans found in known roots.";
      return;
    }
    const groups = bySource(rows);
    let first = true;
    for (const [source, list] of groups) {
      const g = document.createElement("details");
      g.className = "group";
      g.open = first;
      first = false;
      const head = document.createElement("summary");
      head.className = "ghead";
      head.innerHTML = "<b></b><span class='n'></span>";
      head.querySelector("b").textContent = source;
      head.querySelector(".n").textContent = list.length + " plan" + (list.length === 1 ? "" : "s");
      g.appendChild(head);
      const ul = document.createElement("ul");
      for (const it of list) {
        const li = document.createElement("li");
        li.className = "plan" + (selected && selected.path === it.path ? " on" : "");
        const title = document.createElement("div");
        title.className = "title";
        const st = (it.status || "unknown").toLowerCase();
        const badge = document.createElement("span");
        badge.className = "badge " + (st === "apt" || st === "inapt" ? st : "unknown");
        badge.textContent = st;
        title.appendChild(badge);
        title.appendChild(document.createTextNode(it.title || it.name));
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = (it.mtime_local || "") + " · " + (it.rel || it.name);
        li.appendChild(title);
        li.appendChild(meta);
        li.addEventListener("click", () => selectPlan(it));
        ul.appendChild(li);
      }
      g.appendChild(ul);
      listEl.appendChild(g);
    }
  }

  async function selectPlan(it) {
    selected = it;
    render();
    meanEl.textContent = "Loading…";
    bodyEl.textContent = "";
    try {
      const r = await fetch("/api/plans/read?path=" + encodeURIComponent(it.path));
      const j = await r.json();
      if (!j.ok) {
        sections = [];
        renderBriefs();
        meanEl.textContent = j.error || "read failed";
        setMsg("read failed", "err");
        return;
      }
      sections = parseSections(j.text || "");
      secOn = 0;
      renderBriefs();
      setMsg((it.title || it.name) + " · " + sections.length + " briefs", "ok");
    } catch (e) {
      setMsg("error", "err");
      meanEl.textContent = String(e);
    }
  }

  async function load() {
    setMsg("loading…");
    try {
      const r = await fetch("/api/plans/roster");
      const j = await r.json();
      if (!j.ok) {
        setMsg(j.error || "failed", "err");
        listEl.className = "empty";
        listEl.textContent = j.error || "failed";
        return;
      }
      items = j.plans || [];
      const hidden = cullOn ? items.filter((it) => String(it.status || "").toLowerCase() === "inapt").length : 0;
      setMsg(
        items.length + " plans · live roster" + (cullOn ? " · cull hid " + hidden + " inapt" : ""),
        "ok"
      );
      render();
    } catch (e) {
      setMsg(String(e), "err");
      listEl.className = "empty";
      listEl.textContent = String(e);
    }
  }

  const LS = "artifact-planner-live-";
  const timers = {};

  function stashLocal(name) {
    const ta = document.getElementById("t-" + name);
    if (!ta) return;
    try { localStorage.setItem(LS + name, ta.value); } catch (_) {}
  }

  function armSave(name) {
    stashLocal(name);
    clearTimeout(timers[name]);
    timers[name] = setTimeout(() => saveTemp(name), 400);
  }

  async function loadTemps() {
    let remote = {};
    try {
      const r = await fetch("/api/planner/live");
      const j = await r.json();
      if (j.ok) remote = j.slots || {};
    } catch (_) {}
    for (const name of ["memo-brief", "sequence-rough", "sequence-granular"]) {
      const slot = remote[name] || {};
      const ta = document.getElementById("t-" + name);
      let local = "";
      try { local = localStorage.getItem(LS + name) || ""; } catch (_) {}
      const disk = slot.text || "";
      if (ta) ta.value = local.length >= disk.length ? local : disk;
      const mt = document.querySelector("[data-mt='" + name + "']");
      if (mt) mt.textContent = slot.mtime || (ta && ta.value ? "local" : "empty");
    }
  }

  async function saveTemp(name) {
    const ta = document.getElementById("t-" + name);
    try {
      const r = await fetch("/api/planner/live", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ slot: name, text: ta ? ta.value : "" }),
      });
      const j = await r.json();
      if (!j.ok) {
        setMsg(j.error || "save failed", "err");
        return;
      }
      const slot = (j.slots || {})[name] || {};
      const mt = document.querySelector("[data-mt='" + name + "']");
      if (mt) mt.textContent = slot.mtime || "saved";
      setMsg("saved " + name, "ok");
    } catch (e) {
      setMsg(String(e), "err");
    }
  }

  async function runBackup(reason) {
    setMsg("backing up for audit…");
    try {
      const r = await fetch("/api/plans/backup", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ reason: reason || "ui" }),
      });
      const j = await r.json();
      if (!j.ok) {
        setMsg(j.error || "backup failed", "err");
        return null;
      }
      setMsg("backed up " + (j.copied || 0) + " plans · " + (j.stamp || "ok"), "ok");
      return j;
    } catch (e) {
      setMsg(String(e), "err");
      return null;
    }
  }

  function setCull(on) {
    cullOn = !!on;
    try { localStorage.setItem("planatlas-cull", cullOn ? "1" : "0"); } catch (_) {}
    applyCullChrome();
    render();
    renderBriefs();
    const hidden = cullOn ? items.filter((it) => String(it.status || "").toLowerCase() === "inapt").length : 0;
    setMsg(
      items.length + " plans" + (cullOn ? " · cull hid " + hidden + " inapt · empty briefs off" : " · cull off"),
      "ok"
    );
  }

  document.getElementById("go").addEventListener("click", load);
  document.getElementById("backup").addEventListener("click", () => { runBackup("button"); });
  document.getElementById("cull").addEventListener("click", async () => {
    if (cullOn) {
      setCull(false);
      return;
    }
    const bak = await runBackup("cull");
    if (!bak) {
      setMsg("cull blocked — backup first (audit copy failed)", "err");
      return;
    }
    setCull(true);
  });
  q.addEventListener("input", render);
  q.addEventListener("keydown", (e) => {
    if (e.key === "Escape") e.preventDefault();
  });
  document.querySelectorAll("[data-save]").forEach((btn) => {
    btn.addEventListener("click", () => saveTemp(btn.getAttribute("data-save")));
  });
  ["memo-brief", "sequence-rough", "sequence-granular"].forEach((name) => {
    const ta = document.getElementById("t-" + name);
    if (!ta) return;
    ta.addEventListener("input", () => armSave(name));
    ta.addEventListener("keydown", (e) => {
      if (e.key === "Escape") e.preventDefault();
    });
  });
  applyCullChrome();

  (function gutters() {
    const atlas = document.getElementById("atlas");
    const briefsCol = document.getElementById("briefsCol");
    const mean = document.getElementById("mean");
    const gv = document.getElementById("gutterPlan");
    const gh = document.getElementById("gutterMean");
    if (!atlas || !briefsCol || !gv) return;
    const KW = "planatlas-briefs-w";
    const KH = "planatlas-mean-h";
    try {
      const w = parseInt(localStorage.getItem(KW) || "", 10);
      const h = parseInt(localStorage.getItem(KH) || "", 10);
      if (w >= 140) atlas.style.gridTemplateColumns = w + "px 8px minmax(0,1fr)";
      if (h >= 22 && mean) mean.style.maxHeight = h + "px";
    } catch (_) {}
    function drag(gutter, onMove) {
      let on = false;
      gutter.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        on = true;
        gutter.classList.add("dragging");
        try { gutter.setPointerCapture(e.pointerId); } catch (_) {}
        e.preventDefault();
      });
      gutter.addEventListener("pointermove", (e) => {
        if (!on) return;
        onMove(e);
      });
      const end = () => {
        if (!on) return;
        on = false;
        gutter.classList.remove("dragging");
      };
      gutter.addEventListener("pointerup", end);
      gutter.addEventListener("pointercancel", end);
    }
    drag(gv, (e) => {
      const box = atlas.getBoundingClientRect();
      const next = Math.max(140, Math.min(e.clientX - box.left, box.width * 0.55));
      atlas.style.gridTemplateColumns = Math.round(next) + "px 8px minmax(0,1fr)";
      try { localStorage.setItem(KW, String(Math.round(next))); } catch (_) {}
    });
    if (gh && mean) {
      drag(gh, (e) => {
        const box = briefsCol.getBoundingClientRect();
        const next = Math.max(22, Math.min(box.bottom - e.clientY, 72));
        mean.style.maxHeight = Math.round(next) + "px";
        try { localStorage.setItem(KH, String(Math.round(next))); } catch (_) {}
      });
    }
  })();

  load();
  loadTemps();
})();
</script>
