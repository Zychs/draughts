<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>plans</title>
<script>
(function () {
  try {
    if (new URLSearchParams(location.search || "").get("embedded") === "1") {
      document.documentElement.setAttribute("data-embedded", "1");
    }
  } catch (e) {}
})();
</script>
<style>
  @font-face { font-family: "OpenDyslexic3"; src: url("/fonts/OpenDyslexic3-Regular.ttf") format("truetype"); font-weight: 400; }
  @font-face { font-family: "OpenDyslexic3"; src: url("/fonts/OpenDyslexic3-Bold.ttf") format("truetype"); font-weight: 700; }
  :root {
    --bg:#0b0f14; --panel:#121820; --line:#1e2833; --ink:#dfe7ef; --dim:#8b9aab;
    --accent:#7cf7ff; --ok:#51cf66; --err:#ff8a8a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  html[data-type="compact"] body { zoom: 0.82; }
  html[data-type="dense"] body { zoom: 0.9; }
  html[data-type="large"] body { zoom: 1.14; }
  html[data-type="huge"] body { zoom: 1.28; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "OpenDyslexic3", system-ui, sans-serif; font-size: 13px; line-height: 1.35;
    display: grid; grid-template-rows: auto minmax(0,1fr);
  }
  header {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    padding: 7px 8px; border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 14px; letter-spacing: .04em; color: var(--accent); }
  #q {
    flex: 1 1 80px; min-width: 80px;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 8px; font: inherit;
  }
  button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 8px; font: inherit; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  #msg { margin-left: auto; font-size: 11px; color: var(--dim); }
  #msg.ok { color: var(--ok); } #msg.err { color: var(--err); }
  .work { min-height: 0; display: grid; grid-template-columns: minmax(9rem, 38%) minmax(0,1fr); }
  #list { overflow: auto; border-right: 1px solid var(--line); padding: 4px; }
  #view { overflow: auto; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; color: var(--ink); }
  #view .empty { color: var(--dim); }
  .row {
    display: block; width: 100%; text-align: left;
    background: transparent; border: 0; border-radius: 6px;
    padding: 5px 6px; margin: 0 0 2px; color: inherit;
  }
  .row:hover { background: #16202b; }
  .row.on { background: #1a2834; box-shadow: 0 0 0 1px rgba(124,247,255,.35) inset; }
  .row .t { font-weight: 700; display: block; }
  .row .m { color: var(--dim); font-size: 11px; }
  .row.inapt { opacity: .45; }
  html[data-embedded="1"] h1 { font-size: 13px; }
</style>
<header>
  <h1>plans</h1>
  <input id="q" type="search" placeholder="filter" autocomplete="off" />
  <button type="button" id="open" disabled>open</button>
  <span id="msg"></span>
</header>
<div class="work">
  <div id="list"></div>
  <pre id="view"><span class="empty">pick a plan</span></pre>
</div>
<script src="/type-scale.js"></script>
<script>
  if (window.TypeScale) {
    TypeScale.installDocument({
      storageKey: "artifact-scanner-type-scale-plans",
      label: "plans",
    });
  }
  const API = (location.protocol === "file:" || !location.port) ? "http://127.0.0.1:8765" : "";
  const list = document.getElementById("list");
  const view = document.getElementById("view");
  const q = document.getElementById("q");
  const openBtn = document.getElementById("open");
  const msg = document.getElementById("msg");
  let plans = [];
  let on = null;

  const esc = s => String(s || "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const say = (t, cls) => { msg.textContent = t || ""; msg.className = cls || ""; };

  function filtered() {
    const needle = (q.value || "").trim().toLowerCase();
    return plans.filter(p => {
      if (p.status === "inapt" && !needle) return false;
      if (!needle) return true;
      const blob = [p.title, p.name, p.slug, p.source, p.rel, (p.aliases || []).join(" ")].join(" ").toLowerCase();
      return blob.indexOf(needle) >= 0;
    });
  }

  function paintList() {
    const rows = filtered();
    if (!rows.length) {
      list.innerHTML = '<div class="row"><span class="m">no plans</span></div>';
      return;
    }
    list.innerHTML = rows.map(p => {
      const cls = "row" + (on && on.path === p.path ? " on" : "") + (p.status === "inapt" ? " inapt" : "");
      const meta = [p.source, p.status !== "apt" ? p.status : "", p.mtime_local || ""].filter(Boolean).join(" · ");
      return '<button type="button" class="' + cls + '" data-path="' + esc(p.path) + '">' +
        '<span class="t">' + esc(p.title || p.name) + '</span>' +
        '<span class="m">' + esc(meta) + '</span></button>';
    }).join("");
    list.querySelectorAll("button.row").forEach(b => {
      b.addEventListener("click", () => pick(b.dataset.path));
    });
  }

  async function pick(path) {
    on = plans.find(p => p.path === path) || null;
    paintList();
    openBtn.disabled = !on;
    if (!on) return;
    say("reading…");
    try {
      const r = await fetch(API + "/api/plans/read?path=" + encodeURIComponent(on.path));
      const j = await r.json();
      if (!j.ok) { say(j.error || "read failed", "err"); return; }
      const lines = String(j.text || "").split(/\r?\n/).slice(0, 48);
      view.textContent = lines.join("\n") + (j.truncated || lines.length >= 48 ? "\n…" : "");
      say((on.title || on.name), "ok");
    } catch (e) {
      say("server unreachable :8765", "err");
    }
  }

  async function load() {
    say("listing…");
    try {
      const r = await fetch(API + "/api/plans/roster?limit=200");
      const j = await r.json();
      if (!j.ok) { say(j.error || "roster failed", "err"); return; }
      plans = j.plans || [];
      paintList();
      say((j.apt || 0) + " apt · " + (j.count || 0) + " listed");
    } catch (e) {
      say("server unreachable :8765", "err");
    }
  }

  openBtn.onclick = async () => {
    if (!on) return;
    try {
      if (window.pywebview && window.pywebview.api && window.pywebview.api.open_path) {
        await window.pywebview.api.open_path(on.path);
        say("opened", "ok");
        return;
      }
    } catch (e) {}
    try {
      await fetch(API + "/api/open-editor", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: on.path })
      });
      say("opened", "ok");
    } catch (e) { say("open failed", "err"); }
  };

  q.addEventListener("input", paintList);
  load();
</script>
<script src="/cth-hover.js?v=2"></script>
<script src="/suite-zip.js?v=9"></script>
